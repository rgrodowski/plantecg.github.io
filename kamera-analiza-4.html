<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Analiza Kamera</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0a0a0f; color: #e0e0e0; font-family: 'Courier New', monospace; font-size: 14px; min-height: 100vh; }
  #app { display: grid; grid-template-rows: auto 1fr auto; min-height: 100vh; padding: 10px; gap: 10px; }
  #top { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  #btn-run { background: #1a6b1a; color: #7fff7f; border: 1px solid #3a9b3a; padding: 12px 24px; font-family: inherit; font-size: 15px; cursor: pointer; letter-spacing: 1px; }
  #btn-run:active { background: #0e4a0e; }
  #btn-run.running { background: #6b1a1a; color: #ff7f7f; border-color: #9b3a3a; }
  #timer-section { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  #timer-section label { color: #888; }
  #interval-input { background: #111; color: #e0e0e0; border: 1px solid #333; padding: 6px 10px; font-family: inherit; font-size: 14px; width: 70px; }
  #btn-auto { background: #1a1a6b; color: #7f7fff; border: 1px solid #3a3a9b; padding: 8px 16px; font-family: inherit; font-size: 13px; cursor: pointer; }
  #btn-auto.active { background: #6b6b1a; color: #ffff7f; border-color: #9b9b3a; }
  #btn-auto:active { opacity: 0.7; }
  #status { color: #555; font-size: 12px; margin-top: 4px; min-height: 18px; }
  #status.ok { color: #3a9b3a; }
  #status.err { color: #9b3a3a; }
  #status.info { color: #3a6b9b; }
  #main { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .panel { border: 1px solid #222; padding: 8px; }
  .panel-title { color: #555; font-size: 11px; letter-spacing: 2px; margin-bottom: 6px; }
  canvas { width: 100%; height: auto; display: block; background: #050505; }
  #results { border: 1px solid #222; padding: 10px; }
  .result-row { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid #111; }
  .result-label { color: #666; }
  .result-val { font-size: 16px; letter-spacing: 1px; }
  .result-val.red { color: #ff5555; }
  .result-val.blue { color: #5599ff; }
  .result-val.ratio { color: #ffcc55; }
  #log { background: #050505; border: 1px solid #1a1a1a; padding: 8px; font-size: 11px; color: #444; height: 80px; overflow-y: auto; }
  #log div { padding: 1px 0; }
  #log div.e { color: #6b2a2a; }
  #log div.s { color: #2a6b2a; }
  #log div.i { color: #2a4a6b; }
  video { width: 100%; height: auto; display: block; }
  #video-wrap { position: relative; overflow: hidden; }
</style>
</head>
<body>
<div id="app">
  <div>
    <div id="top">
      <button id="btn-run">▶ URUCHOM</button>
      <div id="timer-section">
        <label>Auto co</label>
        <input id="interval-input" type="number" min="1" max="60" value="5"> min
        <button id="btn-auto">⏱ AUTO: WYŁ</button>
      </div>
    </div>
    <div id="status">Gotowy.</div>
  </div>

  <div id="main">
    <div class="panel">
      <div class="panel-title">PODGLĄD</div>
      <div id="video-wrap"><video id="video" autoplay playsinline muted></video></div>
    </div>
    <div class="panel">
      <div class="panel-title">RÓŻNICA (avg 9x9)</div>
      <canvas id="canvas-diff"></canvas>
    </div>
    <div class="panel">
      <div class="panel-title">KLATKA 1</div>
      <canvas id="canvas1"></canvas>
    </div>
    <div class="panel">
      <div class="panel-title">KLATKA 2</div>
      <canvas id="canvas2"></canvas>
    </div>
  </div>

  <div>
    <div id="results">
      <div class="result-row">
        <span class="result-label">Śr. CZERWONY (top 25%)</span>
        <span class="result-val red" id="val-red">—</span>
      </div>
      <div class="result-row">
        <span class="result-label">Śr. NIEBIESKI (top 25%)</span>
        <span class="result-val blue" id="val-blue">—</span>
      </div>
      <div class="result-row">
        <span class="result-label">CZERWONY / NIEBIESKI</span>
        <span class="result-val ratio" id="val-ratio">—</span>
      </div>
    </div>
    <div id="log"></div>
  </div>
</div>

<canvas id="canvas-tmp1" style="display:none"></canvas>
<canvas id="canvas-tmp2" style="display:none"></canvas>

<script>
const btnRun = document.getElementById('btn-run');
const btnAuto = document.getElementById('btn-auto');
const statusEl = document.getElementById('status');
const intervalInput = document.getElementById('interval-input');
const video = document.getElementById('video');
const canvas1 = document.getElementById('canvas1');
const canvas2 = document.getElementById('canvas2');
const canvasDiff = document.getElementById('canvas-diff');
const canvasTmp1 = document.getElementById('canvas-tmp1');
const canvasTmp2 = document.getElementById('canvas-tmp2');
const valRed = document.getElementById('val-red');
const valBlue = document.getElementById('val-blue');
const valRatio = document.getElementById('val-ratio');
const logEl = document.getElementById('log');

let isRunning = false;
let autoTimer = null;
let stream = null;
let cachedTargetIP = '';

// Probe host via Image trick — onerror = host answered = exists, timeout = no host
function probeHost(ip, timeoutMs) {
  return new Promise(resolve => {
    const img = new Image();
    const t = setTimeout(() => { img.src = ''; resolve(false); }, timeoutMs);
    img.onload  = () => { clearTimeout(t); resolve(true); };
    img.onerror = () => { clearTimeout(t); resolve(true); };
    img.src = 'http://' + ip + '/favicon.ico?' + Date.now();
  });
}

// Scan .140 directly across all plausible third octets in parallel
async function discoverTarget(timeoutMs = 1500) {
  // Cover all common third octets: 0-10, 16, 20, 43 (Android hotspot), 50, 100, 168, 178
  const thirdOctets = [
    ...Array.from({length: 11}, (_, i) => i),   // 0–10
    16, 20, 30, 43, 50, 55, 100, 101, 102, 110, 168, 178, 200
  ];
  const prefixes2 = ['192.168', '10.0', '10.1', '172.16', '172.20'];

  const candidates = [];
  for (const p of prefixes2) {
    for (const t of thirdOctets) {
      candidates.push(p + '.' + t + '.140');
    }
  }
  // Also bare /24 for 10.x.x.140
  for (let i = 0; i <= 5; i++) candidates.push('10.' + i + '.0.140');

  log('Skanuję ' + candidates.length + ' adresów równolegle...', 'i');

  return new Promise(resolve => {
    let resolved = false;
    let pending = candidates.length;
    candidates.forEach(ip => {
      probeHost(ip, timeoutMs).then(ok => {
        pending--;
        if (ok && !resolved) {
          resolved = true;
          log('Znaleziono urządzenie: ' + ip, 's');
          resolve(ip);
        } else if (pending === 0 && !resolved) {
          resolve(null);
        }
      });
    });
  });
}

async function getTargetIP() {
  if (cachedTargetIP) return cachedTargetIP;
  setStatus('Wykrywanie urządzenia...', 'info');
  let ip = await discoverTarget(1500);
  if (!ip) {
    log('Ponawiam z dłuższym timeoutem (3s)...', 'i');
    ip = await discoverTarget(3000);
  }
  if (ip) {
    cachedTargetIP = ip;
    return ip;
  }
  return null;
}

function log(msg, type = '') {
  const d = document.createElement('div');
  d.textContent = new Date().toLocaleTimeString('pl') + ' ' + msg;
  if (type) d.className = type;
  logEl.appendChild(d);
  logEl.scrollTop = logEl.scrollHeight;
  if (logEl.children.length > 60) logEl.removeChild(logEl.firstChild);
}

function setStatus(msg, type = '') {
  statusEl.textContent = msg;
  statusEl.className = type;
}

function sleep(ms) {
  return new Promise(r => setTimeout(r, ms));
}

async function initCamera() {
  if (stream) return true;
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width: { ideal: 640 }, height: { ideal: 480 } },
      audio: false
    });
    video.srcObject = stream;
    await new Promise(r => { video.onloadedmetadata = r; });
    await video.play();
    log('Kamera OK', 's');
    return true;
  } catch (e) {
    log('Błąd kamery: ' + e.message, 'e');
    setStatus('Błąd kamery: ' + e.message, 'err');
    return false;
  }
}

function captureFrame(targetCanvas) {
  const w = video.videoWidth || 320;
  const h = video.videoHeight || 240;
  targetCanvas.width = w;
  targetCanvas.height = h;
  const ctx = targetCanvas.getContext('2d');
  ctx.drawImage(video, 0, 0, w, h);
  return ctx.getImageData(0, 0, w, h);
}

function subtractFrames(img1, img2, w, h) {
  // img2 - img1, clamp negatives to 0, no abs
  const result = new Uint8ClampedArray(w * h * 4);
  for (let i = 0; i < w * h * 4; i += 4) {
    result[i]   = Math.max(0, img2.data[i]   - img1.data[i]);
    result[i+1] = Math.max(0, img2.data[i+1] - img1.data[i+1]);
    result[i+2] = Math.max(0, img2.data[i+2] - img1.data[i+2]);
    result[i+3] = 255;
  }
  return result;
}

function averageKernel9x9(data, w, h) {
  const out = new Uint8ClampedArray(data.length);
  const r = 4; // half of 9
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      let sr = 0, sg = 0, sb = 0, cnt = 0;
      for (let dy = -r; dy <= r; dy++) {
        for (let dx = -r; dx <= r; dx++) {
          const nx = x + dx, ny = y + dy;
          if (nx >= 0 && nx < w && ny >= 0 && ny < h) {
            const idx = (ny * w + nx) * 4;
            sr += data[idx]; sg += data[idx+1]; sb += data[idx+2];
            cnt++;
          }
        }
      }
      const idx = (y * w + x) * 4;
      out[idx]   = sr / cnt;
      out[idx+1] = sg / cnt;
      out[idx+2] = sb / cnt;
      out[idx+3] = 255;
    }
  }
  return out;
}

async function httpGet(url) {
  try {
    const r = await fetch(url, { mode: 'no-cors', cache: 'no-store' });
    return true;
  } catch (e) {
    log('HTTP err ' + url + ': ' + e.message, 'e');
    return false;
  }
}

async function runSequence() {
  if (isRunning) return;
  isRunning = true;
  btnRun.classList.add('running');
  btnRun.textContent = '⏳ PRACUJE...';

  try {
    // 1+2. Detect network and build target IP (cached after first run)
    const targetIP = await getTargetIP();
    if (!targetIP) {
      setStatus('Nie wykryto sieci WiFi. Sprawdź połączenie.', 'err');
      isRunning = false; btnRun.classList.remove('running'); btnRun.textContent = '▶ URUCHOM'; return;
    }
    log('Używam adresu: ' + targetIP);

    // Init camera
    setStatus('Inicjalizacja kamery...', 'info');
    const camOk = await initCamera();
    if (!camOk) { isRunning = false; btnRun.classList.remove('running'); btnRun.textContent = '▶ URUCHOM'; return; }

    // 3. Send HTTP /on
    setStatus('Krok 3: HTTP /on → ' + targetIP, 'info');
    log('GET http://' + targetIP + '/on');
    await httpGet('http://' + targetIP + '/on');

    // 4. Wait 100ms
    setStatus('Krok 4: Oczekiwanie 100 ms...', 'info');
    log('Czekam 100 ms');
    await sleep(100);

    // 5. Take first photo
    setStatus('Krok 5: Zdjęcie 1...', 'info');
    log('Robię zdjęcie 1');
    const imgData1 = captureFrame(canvasTmp1);
    const w = canvasTmp1.width, h = canvasTmp1.height;
    canvas1.width = w; canvas1.height = h;
    canvas1.getContext('2d').putImageData(imgData1, 0, 0);
    log('Zdjęcie 1: ' + w + 'x' + h, 's');

    // 6. Wait 300ms
    setStatus('Krok 6: Oczekiwanie 300 ms...', 'info');
    log('Czekam 300 ms');
    await sleep(300);

    // 7. Take second photo
    setStatus('Krok 7: Zdjęcie 2...', 'info');
    log('Robię zdjęcie 2');
    const imgData2 = captureFrame(canvasTmp2);
    canvas2.width = w; canvas2.height = h;
    canvas2.getContext('2d').putImageData(imgData2, 0, 0);
    log('Zdjęcie 2 OK', 's');

    // 8. Send HTTP /off
    setStatus('Krok 8: HTTP /off → ' + targetIP, 'info');
    log('GET http://' + targetIP + '/off');
    await httpGet('http://' + targetIP + '/off');

    // 9. Subtract: frame2 - frame1, negatives → 0
    setStatus('Krok 9-10: Odejmowanie klatek...', 'info');
    log('Odejmowanie (kl2 - kl1), neg → 0');
    const diffData = subtractFrames(imgData1, imgData2, w, h);

    // 11. Average kernel 9x9
    setStatus('Krok 11: Uśrednianie 9x9...', 'info');
    log('Uśrednianie kernel 9x9...');
    const smoothed = averageKernel9x9(diffData, w, h);

    // 12. Pixels where R < 10 → black
    setStatus('Krok 12: Filtrowanie niskiego R...', 'info');
    log('Piksele R<10 → czarne');
    for (let i = 0; i < w * h * 4; i += 4) {
      if (smoothed[i] < 10) {
        smoothed[i] = 0; smoothed[i+1] = 0; smoothed[i+2] = 0;
      }
    }

    // Collect non-black pixels
    let pixels = [];
    for (let i = 0; i < w * h * 4; i += 4) {
      if (smoothed[i] > 0 || smoothed[i+1] > 0 || smoothed[i+2] > 0) {
        pixels.push({ r: smoothed[i], g: smoothed[i+1], b: smoothed[i+2] });
      }
    }

    // 13. Sort descending by R
    setStatus('Krok 13: Sortowanie...', 'info');
    log('Sortowanie malejące po R (' + pixels.length + ' px)');
    pixels.sort((a, b) => b.r - a.r);

    // Display diff
    canvasDiff.width = w; canvasDiff.height = h;
    const diffCtx = canvasDiff.getContext('2d');
    const dispImg = new ImageData(new Uint8ClampedArray(smoothed), w, h);
    diffCtx.putImageData(dispImg, 0, 0);

    // 14. Top 25% → avg R and B
    setStatus('Krok 14: Analiza top 25%...', 'info');
    const top25count = Math.max(1, Math.floor(pixels.length * 0.25));
    const topPixels = pixels.slice(0, top25count);
    log('Top 25%: ' + top25count + ' px');

    let sumR = 0, sumB = 0;
    for (const px of topPixels) { sumR += px.r; sumB += px.b; }
    const avgR = sumR / top25count;
    const avgB = sumB / top25count;
    const ratio = avgB > 0 ? avgR / avgB : Infinity;

    // 15. Display results
    setStatus('Gotowy. Wyniki obliczone.', 'ok');
    valRed.textContent = avgR.toFixed(2);
    valBlue.textContent = avgB.toFixed(2);
    valRatio.textContent = isFinite(ratio) ? ratio.toFixed(4) : '∞';
    log('Śr. R=' + avgR.toFixed(2) + '  Śr. B=' + avgB.toFixed(2) + '  R/B=' + (isFinite(ratio) ? ratio.toFixed(4) : '∞'), 's');

  } catch (e) {
    log('BŁĄD: ' + e.message, 'e');
    setStatus('Błąd: ' + e.message, 'err');
  }

  isRunning = false;
  btnRun.classList.remove('running');
  btnRun.textContent = '▶ URUCHOM';
}

btnRun.addEventListener('click', () => { runSequence(); });

btnAuto.addEventListener('click', () => {
  if (autoTimer) {
    clearInterval(autoTimer);
    autoTimer = null;
    btnAuto.textContent = '⏱ AUTO: WYŁ';
    btnAuto.classList.remove('active');
    log('Auto: wyłączone');
  } else {
    const mins = Math.max(1, Math.min(60, parseInt(intervalInput.value) || 5));
    intervalInput.value = mins;
    autoTimer = setInterval(() => { runSequence(); }, mins * 60000);
    btnAuto.textContent = '⏱ AUTO: ' + mins + ' min';
    btnAuto.classList.add('active');
    log('Auto: co ' + mins + ' min');
  }
});
</script>
</body>
</html>
