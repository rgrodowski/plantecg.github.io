<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>PhotonScope</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap');

  :root {
    --bg: #050a0f;
    --panel: #0a1520;
    --border: #0d3a5c;
    --accent: #00d4ff;
    --accent2: #ff6b00;
    --green: #00ff88;
    --red: #ff2244;
    --text: #a8d4e8;
    --dim: #3a6080;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Share Tech Mono', monospace;
    min-height: 100vh;
    overflow-x: hidden;
    background-image:
      radial-gradient(ellipse at 20% 0%, rgba(0,80,120,0.15) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 100%, rgba(0,40,80,0.2) 0%, transparent 60%);
  }

  .scanline {
    pointer-events: none;
    position: fixed; inset: 0; z-index: 9999;
    background: repeating-linear-gradient(
      0deg, transparent, transparent 2px,
      rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 4px
    );
  }

  header {
    padding: 16px 20px 12px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    background: rgba(0,20,40,0.8);
  }
  header h1 {
    font-family: 'Orbitron', sans-serif;
    font-size: 1.3rem; font-weight: 900;
    color: var(--accent);
    letter-spacing: 4px;
    text-shadow: 0 0 20px rgba(0,212,255,0.5);
  }
  .status-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--dim);
    box-shadow: none;
    transition: all 0.3s;
    display: inline-block; margin-right: 6px;
  }
  .status-dot.active { background: var(--green); box-shadow: 0 0 8px var(--green); }
  .status-dot.error  { background: var(--red);   box-shadow: 0 0 8px var(--red); }
  #statusText { font-size: 0.7rem; color: var(--dim); }

  .main {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: auto auto auto;
    gap: 10px;
    padding: 10px;
  }

  @media (max-width: 700px) {
    .main { grid-template-columns: 1fr; }
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 10px;
    position: relative;
    overflow: hidden;
  }
  .panel::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    opacity: 0.4;
  }
  .panel-label {
    font-size: 0.6rem; letter-spacing: 3px;
    color: var(--dim); margin-bottom: 6px;
    text-transform: uppercase;
  }

  /* Camera / Canvas area */
  .cam-area {
    grid-column: 1 / -1;
    display: flex; gap: 10px; flex-wrap: wrap;
  }
  .cam-wrap {
    flex: 1; min-width: 200px;
  }
  video, canvas {
    width: 100%; display: block;
    border: 1px solid var(--border);
    background: #000;
    image-rendering: pixelated;
  }
  canvas { cursor: crosshair; }

  /* Controls */
  .controls {
    display: flex; flex-direction: column; gap: 10px;
  }

  .btn-trigger {
    font-family: 'Orbitron', sans-serif;
    font-size: 1rem; font-weight: 700;
    letter-spacing: 3px;
    background: transparent;
    border: 2px solid var(--accent);
    color: var(--accent);
    padding: 18px 10px;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.2s;
    text-shadow: 0 0 10px rgba(0,212,255,0.4);
    box-shadow: inset 0 0 20px rgba(0,212,255,0.05), 0 0 20px rgba(0,212,255,0.1);
    position: relative;
    overflow: hidden;
  }
  .btn-trigger:hover {
    background: rgba(0,212,255,0.1);
    box-shadow: inset 0 0 30px rgba(0,212,255,0.1), 0 0 30px rgba(0,212,255,0.3);
  }
  .btn-trigger:active { transform: scale(0.97); }
  .btn-trigger.running {
    border-color: var(--accent2);
    color: var(--accent2);
    text-shadow: 0 0 10px rgba(255,107,0,0.5);
    animation: pulse 1.5s ease-in-out infinite;
  }
  .btn-trigger::after {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(135deg, transparent 40%, rgba(255,255,255,0.03) 50%, transparent 60%);
    transform: translateX(-100%);
    transition: transform 0.5s;
  }
  .btn-trigger:hover::after { transform: translateX(100%); }

  @keyframes pulse {
    0%,100% { box-shadow: inset 0 0 20px rgba(255,107,0,0.05), 0 0 10px rgba(255,107,0,0.2); }
    50%      { box-shadow: inset 0 0 30px rgba(255,107,0,0.1), 0 0 30px rgba(255,107,0,0.5); }
  }

  .param-row {
    display: flex; align-items: center; gap: 8px;
  }
  .param-row label { font-size: 0.65rem; color: var(--dim); white-space: nowrap; }
  input[type=range] {
    flex: 1; accent-color: var(--accent); cursor: pointer;
  }
  .param-val {
    font-size: 0.75rem; color: var(--accent);
    min-width: 40px; text-align: right;
  }
  input[type=text], input[type=number] {
    background: rgba(0,20,40,0.8);
    border: 1px solid var(--border);
    color: var(--accent);
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.75rem;
    padding: 4px 8px;
    border-radius: 2px;
    width: 100%;
  }
  input:focus { outline: none; border-color: var(--accent); }

  .autorow {
    display: flex; align-items: center; gap: 8px;
  }
  .toggle {
    position: relative; width: 36px; height: 18px; flex-shrink: 0;
  }
  .toggle input { opacity: 0; width: 0; height: 0; }
  .toggle-slider {
    position: absolute; inset: 0;
    background: var(--dim); border-radius: 18px; cursor: pointer;
    transition: 0.3s;
  }
  .toggle-slider::before {
    content: ''; position: absolute;
    width: 12px; height: 12px; border-radius: 50%;
    background: #fff; bottom: 3px; left: 3px;
    transition: 0.3s;
  }
  .toggle input:checked + .toggle-slider { background: var(--accent); }
  .toggle input:checked + .toggle-slider::before { transform: translateX(18px); }

  /* Log */
  #log {
    height: 120px; overflow-y: auto;
    font-size: 0.65rem; line-height: 1.6;
  }
  #log::-webkit-scrollbar { width: 4px; }
  #log::-webkit-scrollbar-track { background: var(--bg); }
  #log::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  .log-ok   { color: var(--green); }
  .log-err  { color: var(--red); }
  .log-info { color: var(--text); }
  .log-dim  { color: var(--dim); }

  /* Results table */
  .results-area { grid-column: 1 / -1; }
  table {
    width: 100%; border-collapse: collapse;
    font-size: 0.7rem;
  }
  th {
    color: var(--dim); font-weight: normal;
    border-bottom: 1px solid var(--border);
    padding: 4px 6px; text-align: right;
    letter-spacing: 1px; font-size: 0.6rem;
  }
  th:first-child { text-align: left; }
  td {
    padding: 4px 6px; border-bottom: 1px solid rgba(13,58,92,0.4);
    text-align: right; color: var(--text);
  }
  td:first-child { text-align: left; color: var(--accent); }
  tr:hover td { background: rgba(0,212,255,0.04); }
  .avg-row td { color: var(--accent2); border-top: 1px solid var(--border); }
  .color-bar {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    margin-right: 4px; vertical-align: middle;
  }

  /* Network info */
  #netInfo { font-size: 0.7rem; color: var(--accent); }

  /* Countdown */
  #countdown {
    font-family: 'Orbitron', sans-serif;
    font-size: 1.4rem; color: var(--dim);
    text-align: center; letter-spacing: 2px;
  }
  #countdown.ticking { color: var(--accent2); text-shadow: 0 0 12px rgba(255,107,0,0.5); }

  .seq-step {
    font-size: 0.65rem; padding: 2px 0;
    transition: color 0.2s;
  }
  .seq-step.active { color: var(--green); }
  .seq-step.done   { color: var(--dim); }
  .seq-step.idle   { color: var(--dim); opacity: 0.5; }

  #progressBar {
    height: 2px; background: var(--border); border-radius: 1px; margin-top: 8px;
    overflow: hidden;
  }
  #progressFill {
    height: 100%; width: 0%; background: var(--accent);
    transition: width 0.3s; border-radius: 1px;
  }
</style>
</head>
<body>
<div class="scanline"></div>

<header>
  <h1>PHOTONSCOPE</h1>
  <div>
    <span class="status-dot" id="sdot"></span>
    <span id="statusText">OFFLINE</span>
  </div>
</header>

<div class="main">

  <!-- Camera + canvases -->
  <div class="panel cam-area">
    <div class="cam-wrap">
      <div class="panel-label">▶ KAMERA</div>
      <video id="video" autoplay playsinline muted></video>
    </div>
    <div class="cam-wrap">
      <div class="panel-label">▶ RÓŻNICA (śr. 9x9)</div>
      <canvas id="canvasDiff"></canvas>
    </div>
    <div class="cam-wrap">
      <div class="panel-label">▶ MAKSIMA</div>
      <canvas id="canvasOut"></canvas>
    </div>
  </div>

  <!-- Controls -->
  <div class="panel controls">
    <div class="panel-label">▶ STEROWANIE</div>

    <button class="btn-trigger" id="btnTrigger">URUCHOM</button>

    <div class="autorow" style="margin-top:4px;">
      <label class="toggle">
        <input type="checkbox" id="autoToggle">
        <span class="toggle-slider"></span>
      </label>
      <span style="font-size:0.65rem; color:var(--dim)">AUTO / co</span>
      <input type="number" id="intervalInput" value="5" min="1" max="60" style="width:50px;">
      <span style="font-size:0.65rem; color:var(--dim)">min</span>
    </div>

    <div id="countdown">--:--</div>

    <div style="margin-top:4px;">
      <div class="panel-label">▶ SERWER (ostatni oktet = 199)</div>
      <div id="netInfo">wykrywanie sieci...</div>
    </div>

    <div id="progressBar"><div id="progressFill"></div></div>

    <div id="seqSteps" style="margin-top:8px;"></div>
  </div>

  <!-- Log -->
  <div class="panel">
    <div class="panel-label">▶ LOG</div>
    <div id="log"></div>
  </div>

  <!-- Results -->
  <div class="panel results-area">
    <div class="panel-label">▶ WYNIKI — 10 NAJJAŚNIEJSZYCH MAKSIMÓW</div>
    <div id="results">
      <table>
        <thead>
          <tr>
            <th>#</th><th>X</th><th>Y</th><th>Jasność</th>
            <th><span class="color-bar" style="background:red"></span>R</th>
            <th><span class="color-bar" style="background:#4af"></span>B</th>
            <th>R/B</th>
          </tr>
        </thead>
        <tbody id="tBody"></tbody>
      </table>
    </div>
  </div>

</div>

<!-- Hidden canvases for processing -->
<canvas id="c1" style="display:none"></canvas>
<canvas id="c2" style="display:none"></canvas>
<canvas id="c3" style="display:none"></canvas>

<script>
// ─────────────────────────────────────────────────────────────────
// State
// ─────────────────────────────────────────────────────────────────
const video       = document.getElementById('video');
const canvasDiff  = document.getElementById('canvasDiff');
const canvasOut   = document.getElementById('canvasOut');
const c1 = document.getElementById('c1');
const c2 = document.getElementById('c2');
const c3 = document.getElementById('c3');
const btnTrigger  = document.getElementById('btnTrigger');
const autoToggle  = document.getElementById('autoToggle');
const intervalInp = document.getElementById('intervalInput');
const countdownEl = document.getElementById('countdown');
const logEl       = document.getElementById('log');
const netInfoEl   = document.getElementById('netInfo');
const sdot        = document.getElementById('sdot');
const statusText  = document.getElementById('statusText');
const progressFill= document.getElementById('progressFill');
const seqStepsEl  = document.getElementById('seqSteps');
const tBody       = document.getElementById('tBody');

const STEPS = [
  '1. Zdjęcie #1 (przed)',
  '2. Wykrywanie sieci WiFi',
  '3. HTTP → serwer /on',
  '4. Oczekiwanie 5 ms',
  '5. Zdjęcie #2',
  '6. Oczekiwanie 300 ms',
  '7. Zdjęcie #3 (po)',
  '8. HTTP → serwer /off',
  '9. Odejmowanie: zdjęcie3 – zdjęcie1',
  '10. Uśrednianie kernel 9×9',
  '11. Szukanie lokalnych maksimów',
  '12. Zaznaczanie 10 najjaśniejszych',
  '13. Obliczanie R/B',
  '14. Wyświetlanie wyników'
];

let stepEls = [];
let running = false;
let autoTimer = null;
let countdownInterval = null;
let serverBase = null;
let nextRunAt = null;

// ─────────────────────────────────────────────────────────────────
// Init
// ─────────────────────────────────────────────────────────────────
(async () => {
  buildStepUI();
  await initCamera();
  detectNetwork();
})();

function buildStepUI() {
  seqStepsEl.innerHTML = '';
  stepEls = STEPS.map((s, i) => {
    const d = document.createElement('div');
    d.className = 'seq-step idle';
    d.textContent = s;
    seqStepsEl.appendChild(d);
    return d;
  });
}

async function initCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }
    });
    video.srcObject = stream;
    await new Promise(r => video.onloadedmetadata = r);
    setStatus('GOTOWY', 'active');
    logLine('Kamera zainicjowana', 'ok');
  } catch(e) {
    setStatus('BRAK KAMERY', 'error');
    logLine('Błąd kamery: ' + e.message, 'err');
  }
}

// ─────────────────────────────────────────────────────────────────
// Network detection
// ─────────────────────────────────────────────────────────────────
function detectNetwork() {
  if (window.RTCPeerConnection) {
    const pc = new RTCPeerConnection({ iceServers: [] });
    pc.createDataChannel('');
    pc.createOffer().then(o => pc.setLocalDescription(o));
    pc.onicecandidate = e => {
      if (!e.candidate) return;
      const ip = /([0-9]{1,3}(\.[0-9]{1,3}){3})/.exec(e.candidate.candidate)?.[1];
      if (ip && !ip.startsWith('127')) {
        const parts = ip.split('.');
        serverBase = parts[0]+'.'+parts[1]+'.'+parts[2]+'.199';
        netInfoEl.textContent = 'Serwer: ' + serverBase;
        logLine('Sieć: ' + ip + ' → serwer: ' + serverBase, 'ok');
        pc.close();
      }
    };
    setTimeout(() => {
      if (!serverBase) {
        serverBase = '192.168.1.199';
        netInfoEl.textContent = 'Serwer: ' + serverBase + ' (domyślny)';
        logLine('Fallback IP: ' + serverBase, 'info');
      }
    }, 3000);
  } else {
    serverBase = '192.168.1.199';
    netInfoEl.textContent = 'Serwer: ' + serverBase + ' (domyślny)';
  }
}

// ─────────────────────────────────────────────────────────────────
// Button
// ─────────────────────────────────────────────────────────────────
btnTrigger.addEventListener('click', () => {
  if (running) return;
  runSequence();
});

autoToggle.addEventListener('change', () => {
  if (autoToggle.checked) {
    startAuto();
  } else {
    stopAuto();
  }
});

// ─────────────────────────────────────────────────────────────────
// Auto repeat
// ─────────────────────────────────────────────────────────────────
function startAuto() {
  stopAuto();
  const mins = Math.min(60, Math.max(1, parseInt(intervalInp.value) || 5));
  intervalInp.value = mins;
  scheduleNext(mins * 60 * 1000);
  logLine('Auto-tryb: co ' + mins + ' min', 'info');
}

function scheduleNext(ms) {
  nextRunAt = Date.now() + ms;
  updateCountdown();
  countdownInterval = setInterval(updateCountdown, 1000);
  autoTimer = setTimeout(() => {
    clearInterval(countdownInterval);
    runSequence().then(() => {
      if (autoToggle.checked) startAuto();
    });
  }, ms);
}

function stopAuto() {
  if (autoTimer) clearTimeout(autoTimer);
  if (countdownInterval) clearInterval(countdownInterval);
  autoTimer = null; countdownInterval = null; nextRunAt = null;
  countdownEl.textContent = '--:--';
  countdownEl.classList.remove('ticking');
}

function updateCountdown() {
  if (!nextRunAt) return;
  const rem = Math.max(0, nextRunAt - Date.now());
  const m = Math.floor(rem / 60000);
  const s = Math.floor((rem % 60000) / 1000);
  countdownEl.textContent = String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
  countdownEl.classList.toggle('ticking', rem < 30000);
}

// ─────────────────────────────────────────────────────────────────
// Main sequence
// ─────────────────────────────────────────────────────────────────
async function runSequence() {
  if (running) return;
  running = true;
  btnTrigger.classList.add('running');
  btnTrigger.textContent = 'TRWA...';
  resetSteps();
  progressFill.style.width = '0%';
  setStatus('PRACA', 'active');

  const W = video.videoWidth  || 640;
  const H = video.videoHeight || 480;

  [c1, c2, c3, canvasDiff, canvasOut].forEach(c => { c.width = W; c.height = H; });

  try {
    // Step 1 – photo 1
    await step(0, () => captureFrame(c1));
    // Step 2 – network
    await step(1, () => ensureNetwork());
    // Step 3 – /on
    await step(2, () => httpCmd('on'));
    // Step 4 – 5ms wait
    await step(3, () => delay(5));
    // Step 5 – photo 2
    await step(4, () => captureFrame(c2));
    // Step 6 – 300ms wait
    await step(5, () => delay(300));
    // Step 7 – photo 3
    await step(6, () => captureFrame(c3));
    // Step 8 – /off
    await step(7, () => httpCmd('off'));
    // Step 9 – subtract
    await step(8, () => subtract(c1, c3, canvasDiff));
    // Step 10 – blur 9x9
    const blurData = await step(9, () => blur9x9(canvasDiff));
    // Step 11 – local maxima
    const maxima = await step(10, () => findLocalMaxima(blurData, W, H));
    // Step 12 – top10
    const top10 = await step(11, () => getTop10(maxima, blurData, W));
    drawMaxima(top10, W, H, c3);
    // Step 13 – R/B ratios
    const ratios = await step(12, () => computeRatios(top10, c3, W, H));
    // Step 14 – display
    await step(13, () => displayResults(top10, ratios));

    setStatus('GOTOWY', 'active');
    logLine('Sekwencja zakończona ✓', 'ok');

  } catch(e) {
    setStatus('BŁĄD', 'error');
    logLine('Błąd: ' + e.message, 'err');
  }

  progressFill.style.width = '100%';
  running = false;
  btnTrigger.classList.remove('running');
  btnTrigger.textContent = 'URUCHOM';
}

async function step(idx, fn) {
  stepEls[idx].className = 'seq-step active';
  progressFill.style.width = ((idx / STEPS.length) * 100) + '%';
  const result = await fn();
  stepEls[idx].className = 'seq-step done';
  return result;
}

function resetSteps() {
  stepEls.forEach(el => el.className = 'seq-step idle');
}

// ─────────────────────────────────────────────────────────────────
// Camera capture
// ─────────────────────────────────────────────────────────────────
function captureFrame(canvas) {
  const ctx = canvas.getContext('2d');
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
  logLine('Zdjęcie → ' + canvas.id, 'dim');
}

// ─────────────────────────────────────────────────────────────────
// HTTP
// ─────────────────────────────────────────────────────────────────
async function httpCmd(cmd) {
  const url = 'http://' + (serverBase || '192.168.1.199') + '/' + cmd;
  logLine('HTTP GET ' + url, 'dim');
  try {
    const resp = await fetch(url, { signal: AbortSignal.timeout(2000) });
    logLine('→ ' + resp.status, 'ok');
  } catch(e) {
    logLine('→ timeout/brak odpowiedzi (OK dla LAN)', 'info');
  }
}

function ensureNetwork() {
  if (!serverBase) detectNetwork();
  logLine('Sieć: ' + (serverBase || 'wykrywanie...'), 'dim');
}

// ─────────────────────────────────────────────────────────────────
// Image processing
// ─────────────────────────────────────────────────────────────────
function subtract(ca, cb, out) {
  const W = ca.width, H = ca.height;
  const ctxa = ca.getContext('2d'), ctxb = cb.getContext('2d');
  const ctxo = out.getContext('2d');
  const da = ctxa.getImageData(0,0,W,H).data;
  const db = ctxb.getImageData(0,0,W,H).data;
  const id = ctxo.createImageData(W, H);
  const d  = id.data;
  for (let i = 0; i < da.length; i += 4) {
    d[i]   = Math.abs(db[i]   - da[i]);
    d[i+1] = Math.abs(db[i+1] - da[i+1]);
    d[i+2] = Math.abs(db[i+2] - da[i+2]);
    d[i+3] = 255;
  }
  ctxo.putImageData(id, 0, 0);
  logLine('Różnica obliczona', 'dim');
}

function blur9x9(canvas) {
  const W = canvas.width, H = canvas.height;
  const ctx = canvas.getContext('2d');
  const src = ctx.getImageData(0,0,W,H).data;
  const lum = new Float32Array(W * H);
  // Build grayscale luminance
  for (let i = 0; i < W*H; i++) {
    lum[i] = 0.299*src[i*4] + 0.587*src[i*4+1] + 0.114*src[i*4+2];
  }
  const out = new Float32Array(W * H);
  const K = 4; // half-kernel for 9x9
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      let sum = 0, cnt = 0;
      for (let dy = -K; dy <= K; dy++) {
        for (let dx = -K; dx <= K; dx++) {
          const nx = x+dx, ny = y+dy;
          if (nx>=0 && nx<W && ny>=0 && ny<H) { sum += lum[ny*W+nx]; cnt++; }
        }
      }
      out[y*W+x] = sum / cnt;
    }
  }
  logLine('Kernel 9×9 zastosowany', 'dim');
  return { data: out, W, H };
}

function findLocalMaxima({ data, W, H }) {
  const maxima = [];
  const R = 5; // local neighbourhood radius
  for (let y = R; y < H-R; y++) {
    for (let x = R; x < W-R; x++) {
      const v = data[y*W+x];
      if (v < 10) continue; // skip dark
      let isMax = true;
      outer: for (let dy = -R; dy <= R; dy++) {
        for (let dx = -R; dx <= R; dx++) {
          if (dx===0 && dy===0) continue;
          if (data[(y+dy)*W+(x+dx)] >= v) { isMax = false; break outer; }
        }
      }
      if (isMax) maxima.push({ x, y, v });
    }
  }
  logLine('Znaleziono ' + maxima.length + ' lokalnych maksimów', 'dim');
  return maxima;
}

function getTop10(maxima, blurData, W) {
  // NMS – suppress too-close maxima
  maxima.sort((a,b) => b.v - a.v);
  const MIN_DIST = 20;
  const selected = [];
  for (const m of maxima) {
    if (selected.length >= 10) break;
    const tooClose = selected.some(s => Math.hypot(s.x-m.x, s.y-m.y) < MIN_DIST);
    if (!tooClose) selected.push(m);
  }
  logLine('Top10 wybranych: ' + selected.length, 'dim');
  return selected;
}

function drawMaxima(top10, W, H, srcCanvas) {
  const ctx = canvasOut.getContext('2d');
  ctx.drawImage(srcCanvas, 0, 0);
  const R = 18;
  top10.forEach((m, i) => {
    ctx.beginPath();
    ctx.arc(m.x, m.y, R, 0, Math.PI*2);
    ctx.strokeStyle = '#00d4ff';
    ctx.lineWidth = 2;
    ctx.stroke();
    // crosshair
    ctx.beginPath();
    ctx.moveTo(m.x-R, m.y); ctx.lineTo(m.x+R, m.y);
    ctx.moveTo(m.x, m.y-R); ctx.lineTo(m.x, m.y+R);
    ctx.strokeStyle = 'rgba(0,212,255,0.5)';
    ctx.lineWidth = 1;
    ctx.stroke();
    // label
    ctx.fillStyle = '#00d4ff';
    ctx.font = 'bold 13px monospace';
    ctx.fillText(i+1, m.x + R + 3, m.y - 4);
  });
}

function computeRatios(top10, canvas, W, H) {
  const ctx = canvas.getContext('2d');
  const ROI = 10;
  return top10.map(m => {
    const x0 = Math.max(0, m.x-ROI), y0 = Math.max(0, m.y-ROI);
    const w  = Math.min(ROI*2, W-x0), h = Math.min(ROI*2, H-y0);
    const data = ctx.getImageData(x0, y0, w, h).data;
    let r=0, b=0;
    for (let i=0; i<data.length; i+=4) {
      if (data[i]   > 30) r++;
      if (data[i+2] > 30) b++;
    }
    return { r, b, ratio: b > 0 ? r/b : null };
  });
}

function displayResults(top10, ratios) {
  tBody.innerHTML = '';
  let sumRatio = 0, cntRatio = 0;
  top10.forEach((m, i) => {
    const { r, b, ratio } = ratios[i];
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${i+1}</td>
      <td>${m.x}</td><td>${m.y}</td>
      <td>${m.v.toFixed(1)}</td>
      <td>${r}</td><td>${b}</td>
      <td>${ratio !== null ? ratio.toFixed(3) : '∞'}</td>
    `;
    tBody.appendChild(tr);
    if (ratio !== null) { sumRatio += ratio; cntRatio++; }
  });
  // Average row
  const avgRatio = cntRatio > 0 ? (sumRatio / cntRatio).toFixed(3) : '—';
  const trAvg = document.createElement('tr');
  trAvg.className = 'avg-row';
  trAvg.innerHTML = `<td>ØŚR</td><td colspan="5"></td><td>${avgRatio}</td>`;
  tBody.appendChild(trAvg);
  logLine('Wyniki wyświetlone. Śr. R/B = ' + avgRatio, 'ok');
}

// ─────────────────────────────────────────────────────────────────
// Helpers
// ─────────────────────────────────────────────────────────────────
function delay(ms) { return new Promise(r => setTimeout(r, ms)); }

function setStatus(txt, cls) {
  statusText.textContent = txt;
  sdot.className = 'status-dot ' + (cls || '');
}

function logLine(msg, type='info') {
  const d = document.createElement('div');
  d.className = 'log-' + type;
  const now = new Date();
  const ts = now.toTimeString().slice(0,8);
  d.textContent = `[${ts}] ${msg}`;
  logEl.prepend(d);
  while (logEl.children.length > 80) logEl.lastChild.remove();
}
