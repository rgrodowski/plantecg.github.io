//////////////////file upload/////////////////////////

function handleFileSelect(e) {
  const countFiles = e.target.files.length;
  Array.from(e.target.files).forEach(function(file) {
    const reader = new FileReader();
    reader.onload = function() {
      const contents = reader.result;
      files.push(contents);
      tryStartProcessFiles(countFiles);
    };
    reader.readAsText(file);
  });
}
var files = [];
var namfiles = [];

var filesName = document.getElementById("file-input");

filesName.addEventListener("change", (event) => {
  filesName = event.target.files;
  for (const fil of filesName) {
    namfiles.push(fil.name);
  }
});

function tryStartProcessFiles(expectedSize) {        //from file button handler
  if (namfiles.length < expectedSize) {              //wait for all files
    return;
  }  
  handleData(namfiles);                              // -> handleData for one file !
  
  files = [];
  document.getElementById('file-input').disabled = true;
}

                      /////// handleData /////////////
var filesArr = [];

function handleData(namfiles) {                    // for one file
  measNr = 0;
  var allRows = files[0].split("\n");               //all rows of file
  timeRes = allRows[0].split(',');
  if (timeRes[0] != 0.01 && timeRes.length != 119) {
    alert("Wrong file format");
    location.reload();
    return;             
  }

  filesArr.push(allRows);
  if (filesArr.length < namfiles.length) return;
  
  if (namfiles.length == 1) {
    makeCharts(allRows, namfiles);             // charts drawing
    
  } else {                      ////////////   files > 1   ////////////
    var averArr = [];                                 // all average from files
    averArr.push(timeRes.toString());
    for (f = 0; f < namfiles.length; f++) {                    // over all files
  
      var tempRows = filesArr[f];                 // each files rows
      var rowAv = rowsAver(readRows(tempRows));
      averArr.push(rowAv.toString());
    }
    measNr = 0;
    makeCharts(averArr, namfiles);             // charts drawing
  }
}

function makeCharts(allFiles, namfiles) {
    var fileRows = readRows(allFiles);         // extract data rows 
    const nrRows = fileRows.length;
    var filnam = namfiles[0];
    if (nrRows == 2) {
      handleNewDataSet(timeRes, fileRows[1], namfiles[0]);    //label
      addOJIPpar(fileRows[1], filnam);       // radar chart
      e.style.display = 'block';                    // show 'Get results' button
    } else {
      for (nrr = 1; nrr < nrRows; nrr++) {
        if (namfiles.length > 1) {
          filnam = namfiles[nrr - 1];
        }
        handleNewDataSet(timeRes, fileRows[nrr], filnam);   //label for all curves
        addOJIPpar(fileRows[nrr], filnam);
        measNr++;
      }
      var rAv = createAverChart(fileRows);
      e.style.display = 'block';                      // show 'Get results' button    
    }
    handleRows = rowsNorm(fileRows);              // reference row store
    measNr = 0;
    for (nrr = 0; nrr < nrRows - 1; nrr++) {
        if (namfiles.length > 1) {
          filnam = namfiles[nrr];
        }
      handleNormDataSet(timeRes, handleRows[nrr], filnam);   //label for all curves
      measNr++;
    }
      e.style.display = 'block'; 
}

function rowsAver(avrows){
  var averTable = [];
   for (var j = 0; j < timeRes.length; j++) {        // over all data points
    var sumpos = 0;
    var posval = [];
    
    for (var i = 1; i < avrows.length; i++) {      //over all curves
      var datrow = avrows[i];
      datrow = datrow.map(Number);
      posval.push(datrow[j]);
      sumpos += datrow[j];
    }
    var avr = Math.round(sumpos * 100 / (avrows.length - 1)) / 100;
    averTable.push(avr); 
  }
  return averTable;
}

function rowsNorm(arr) {                // allrows there
  var normarr = [];
  var refRow = getNorm(arr[1]);
  for (let n = 1; n < arr.length; n++) {    // row 0 - time last \n
    var curRow = getNorm(arr[n]);
    var normRow = [];
    
    for (let i = 0; i < curRow.length; i++) {
      normRow.push(curRow[i] - refRow[i]);
    }
    normarr.push(normRow);
  }
  return normarr;
}

function getNorm(arr) {             // normalize 1 row from file
  normalize = function(val, max, min) { 
    return(val - min) / (max - min); 
  }
  max = Math.max.apply(null, arr) 
  min = Math.min.apply(null, arr)
  hold_normed_values=[]
  arr.forEach(function(this_num) {
    hold_normed_values.push(normalize(this_num, max, min))
  })
  return(hold_normed_values)
}

function readRows(rowsToRead) {
  var dataRows = [];                                     //only numerical data
  
  for (row of rowsToRead) { 
    if (row.length == 0) break;
    dataRows.push(row.split(',').map(Number));
  }
  return dataRows;
}

function getAver(dataRes) {
  var avtab = [];
  for (var j = 0; j < timeRes.length; j++) {        // over all data points
    var sumpos = 0;
    var posval = [];
  
    for (var n = 1; n < dataRes.length; n++) {      //over all curves
      var datrow = dataRes[n];
      datrow = datrow.map(Number);
      posval.push(datrow[j]);
      sumpos += datrow[j];
    }
    var avr = Math.round(sumpos * 100 / (dataRes.length - 1)) / 100;
    avtab.push(avr);
  }
  return avtab;
}

function handleNewDataSet(timeRes, datares, label) {      // merge time and data
  var scatDat = mergeData(timeRes, datares)

    label: label,
    backgroundColor: colorpalette[measNr],
    pointRadius: 2,
    data: scatDat
  };
  myChart.data.datasets.push(updatset);

  myChart.update();           // new line on chart
}

function handleNormDataSet(timeRes, datares, label) {     // for one set
  var scatDat = mergeData(timeRes, datares)               // merge time and data
  var updatset = {
    label: label,
    backgroundColor: colorpalette[measNr],
    pointRadius: 2,
    data: scatDat
  };
  normChart.data.datasets.push(updatset);
  normChart.update();           // new line on chart
}

function mergeData(tres, datres){  
  var storage = [];
  for (c = 0; c < tres.length; c++) {
    var entry = {y: datres[c], x: tres[c]};
    storage.push(entry);
  }
  return storage;
}

function createAverChart(allrows) {
  var upperCurv = [];
  var bottCurv = [];
  var averTable = [];
  
  const sD = (arr, usePopulation = false) => {
    const mean = arr.reduce((acc, val) => acc + val, 0) / arr.length;
    return Math.sqrt(
      arr
        .reduce((acc, val) => acc.concat((val - mean) ** 2), [])
        .reduce((acc, val) => acc + val, 0) /
        (arr.length - (usePopulation ? 0 : 1))
      );
  };
    
  timeRes = allrows[0];
    
  for (var j = 0; j < timeRes.length; j++) {        // over all data points
    var sumpos = 0;
    var posval = [];
    
    for (var i = 1; i < allrows.length; i++) {      //over all curves
      var datrow = allrows[i];
      datrow = datrow.map(Number);
      posval.push(datrow[j]);
      sumpos += datrow[j];
    }
      
    var avr = Math.round(sumpos * 100 / (allrows.length - 1)) / 100;
    averTable.push(avr);
  
    sdpos = sD(posval);
    upperCurv.push(Math.round((avr + sdpos) * 100) / 100);
    bottCurv.push(Math.round((avr - sdpos) * 100) / 100);
  }
    var label;
    label = "+SD";
    handleNewDataSet(timeRes, upperCurv, label);
    measNr++;
    label = "aver-" + namfiles[0];
    handleNewDataSet(timeRes, averTable, label);
    measNr++;
    label = "-SD";
    handleNewDataSet(timeRes, bottCurv, label);
    measNr++;

    if (measNr > 3) {
      myChart.hide(measNr - 1);                   //hide +SD aver -SD
      myChart.hide(measNr - 2);
      myChart.hide(measNr - 3);
    }
    return averTable;
}

var jipParTable = [];
var maxFuncPar = []; 
                         
function addOJIPpar(ojipres, lab) {
  //console.log("ojipres from addOJIPpar", ojipres);
  maxFuncPar = ojipres;
  var parRow = getParam(ojipres);                      // make parameter values table
  var tempOJIP = [];
  
  for (n = 0; n < parRow.length; n++) {                                //rounding
    var rname = calcP[n];
    if (rname.localeCompare("Sm_tFm") == 0) {
      tempOJIP.push(Math.round(10000 * parRow[n]) / 10000);
    } else {
      tempOJIP.push(Math.round(100 * parRow[n]) / 100);
    }
  }
  jipParTable.push(tempOJIP);
  
  getRadar(tempOJIP, lab);
}

var referRow = [];
var rowNr = 0;

function getRadar(radRes, lab) {                //
  var chartRow = [];
  for (posnr of parPosNr) {
    chartRow.push(radRes[posnr]);
  }
  if (rowNr == 0 && firstRadar == false) {
    firstRadar = true;
    referRow = chartRow;
    chartRow = [100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 
                100, 100, 100, 100, 100, 100, 100, 100, 100, 100
                ];
    var mydataset = {
      labels: paramSet,
      datasets: [{
        label: lab,
        borderColor: colorpalette[0],               // 0 - green
        data: chartRow
      }]
    };
    radarChart = new Chart(radarCanvas, {           /////new instance///////
      type: 'radar',
      data: mydataset,
      options: {
        plugins: {
          customCanvasBackgroundColor: {
            color: 'white'
          }
        },
      },
      plugins: [{
        id: 'customCanvasBackgroundColor',
        beforeDraw: (chart, args, options) => {
        const { ctx } = chart;
        ctx.save();
        ctx.globalCompositeOperation = 'destination-over';
        ctx.fillStyle = options.color || '#99ffff';
        ctx.fillRect(0, 0, chart.width, chart.height);
        ctx.restore();
        }
      }],
    });
    rowNr++;
  } else {
    for (n = 0; n < chartRow.length; n++) {             //refering
      chartRow[n] = 100 * chartRow[n] / referRow[n];
    }
    var updatset = {
      label: lab,
      borderColor: colorpalette[rowNr],
      data: chartRow
    };
    radarChart.data.datasets.push(updatset);
    radarChart.update();
    rowNr++;
  }
} 

function getParam(ojipres) {                   // translate param names and get formulas
  
  //console.log("ojipres from getParam", ojipres);
  const a = ojipres;                            // a -> translation table name!
  var L = {};
  var vals = [];
  
  for (i = 0; i < formP.length; i++) {          // global formP array
    var par = calcP[i];                          //calcP names of parameters for calculations
    var val = eval(formP[i]);
    
    L[par] = val;
    vals.push(val);
  }
  return vals;
}

// courtesy V.Goltsev & M.Paunov

//for radar chart
const paramSet = ['Fo', 'Fm', 'Fv/Fm', 'Phi(Eo)', 'Phi(Ro)', 'Phi(Do)', 'DELTA(Ro)', 'Psi(Eo)', 'GAMMA(Rc)',
          't(Fm)', 'Sm/t(Fm)', 'Mo', 'ABS/RC', 'TRo/RC(to)', 'DIo/RC(to)', 'RC/ABS', 
          'Fv/Fm/(1-Fv/Fm)', 'Psi(Eo)/(1-Psi(Eo))',
          'PI(ABS)', 'PI(total)']

var parNames = "Fo,F50,F100,F300,Fj,Fi,Fm,V50,V300,Fv/Fm,Phi(Eo),Phi(Ro),Phi(Do),";
parNames += "Vj,Vi,DELTA(Ro),Psi(Eo),S2,S3,S4,t(Fm),Mo,S1,Sm/t(Fm),Ss,";
parNames += "ABS/RC,TRo/RC,TRo/RC(to),DIo/RC(to),RC/ABS,GAMMA(Rc),Fv/Fm/(1-Fv/Fm),";
parNames += "Psi(Eo)/(1-Psi(Eo)),PI(ABS),PI(total),Kn,Kp,Piabs-2,Pitotal-2";

var parN = parNames.split(',');
var nameTransl = {};

var calcPar = "Fo,F50,F100,F300,Fj,Fi,Fm,V50,V300,FvFm,PhiEo,PhiRo,PhiDo,Vj,Vi,";   //14
calcPar += "DELTARo,PsiEo,S2,S3,S4,tFm,Mo,S1,Sm_tFm,Ss,ABSRC,TRoRC,TRoRCto,";       //27
calcPar += "DIoRCto,RCABS,GAMMARc,FvFmFct,PsiFct,PIabs,PItot,";                     //34
calcPar += "Kn,Kp,Piabs_2,Pitot_2";                                                 //38

var calcP = calcPar.split(',');

for (i = 0; i < parN.length; i++) {
  nameTransl[calcP[i]] = parN[i];
}

var formPar = "a[0],a[4],a[9],a[29],a[47],a[84],amax(),";                            //0,1,2,3,4,5,6
formPar += "(L.F50-L.Fo)/(L.Fm-L.Fo),(L.F300-L.F50)/(L.Fm-L.F50),(L.Fm-L.Fo)/L.Fm,(L.Fm-L.Fj)/L.Fm,";//7,8,9,10
formPar += "(L.Fm-L.Fi)/L.Fm,1-L.FvFm,(L.Fj-L.Fo)/(L.Fm-L.Fo),";                      //11,12,13
formPar += "(L.Fi-L.Fo)/(L.Fm-L.Fo),(1-L.Vi)/(1-L.Vj),1-((L.Fj-L.Fo)/(L.Fm-L.Fo)),";  //14,15,16
formPar += "(L.Fm-L.Fo)/L.Fo,(1-L.Vj)/L.Vj,(1-L.Vi)/(L.Vi-L.Vj),fmpos(),";            //17,18,19,20
formPar += "4*(L.F300-L.F50)/(L.Fm-L.F50),(1-L.Fo/L.Fm)/(L.Mo/L.Vj),L.S1/fmpos(),";   //21,22,23
formPar += "L.Vj/L.Mo,L.Mo*((1/L.Vj)*(1/L.FvFm)),L.Mo*(1/L.Vj),L.TRoRC*L.PsiEo,";     //24,25,26,27
formPar += "L.ABSRC-L.TRoRCto,1/(L.ABSRC),L.RCABS/(1/L.RCABS),";                      //28,29,30
formPar += "L.FvFm/(1-L.FvFm),L.PsiEo/(1-L.PsiEo),";                                  //31,32
formPar += "L.RCABS * L.FvFmFct * L.PsiFct,";                                         //33
formPar += "L.PIabs * (L.DELTARo/(1-L.DELTARo)),";                                    //34
formPar += "L.Fo/L.Fm,(L.Fm-L.Fo)/L.Fm,L.S1 * L.S2 * L.S3,L.Piabs_2 * L.S4";          //35,36,37,38

var formP = formPar.split(',');

function amax() {
  return Math.max.apply(null, maxFuncPar);
}

function fmpos() {
  var maxx = Math.max(...maxFuncPar);
  var i = maxFuncPar.indexOf(maxx);
  return Math.floor(timeRes[i]);
}
