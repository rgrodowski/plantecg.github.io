<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RGB Analyzer</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@300;500;700&display=swap');

  :root {
    --red: #ff2233;
    --blue: #0077ff;
    --bg: #080c10;
    --panel: #0d1219;
    --border: #1a2535;
    --text: #c8d8e8;
    --dim: #445566;
    --green: #00e887;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Rajdhani', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* SCANLINE OVERLAY */
  body::after {
    content: '';
    position: fixed; inset: 0;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.04) 2px, rgba(0,0,0,0.04) 4px);
    pointer-events: none;
    z-index: 1000;
  }

  header {
    border-bottom: 1px solid var(--border);
    padding: 12px 24px;
    display: flex;
    align-items: center;
    gap: 20px;
    background: linear-gradient(90deg, #0d1219, #080c10);
    position: sticky; top: 0; z-index: 100;
  }

  header h1 {
    font-size: 1.1rem;
    font-weight: 700;
    letter-spacing: 4px;
    color: var(--red);
    text-transform: uppercase;
    font-family: 'Share Tech Mono', monospace;
  }

  header .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--dim); }
  header .dot.active { background: var(--green); box-shadow: 0 0 8px var(--green); animation: blink 1.2s infinite; }

  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

  /* METRICS BAR */
  .metrics {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1px;
    background: var(--border);
    border-bottom: 1px solid var(--border);
  }

  .metric {
    background: var(--panel);
    padding: 16px 24px;
    position: relative;
    overflow: hidden;
  }

  .metric::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
  }
  .metric.ref-m::before { background: var(--green); }
  .metric.val-m::before { background: var(--red); }
  .metric.ratio-m::before { background: var(--blue); }

  .metric label {
    font-size: 0.65rem;
    letter-spacing: 3px;
    color: var(--dim);
    text-transform: uppercase;
    font-family: 'Share Tech Mono', monospace;
    display: block;
    margin-bottom: 6px;
  }

  .metric .value {
    font-family: 'Share Tech Mono', monospace;
    font-size: 2rem;
    font-weight: 400;
    line-height: 1;
  }

  .metric.ref-m .value { color: var(--green); }
  .metric.val-m .value { color: var(--red); }
  .metric.ratio-m .value { color: var(--blue); }

  .metric .unit {
    font-size: 0.7rem;
    color: var(--dim);
    letter-spacing: 2px;
    margin-top: 4px;
    font-family: 'Share Tech Mono', monospace;
  }

  /* MAIN LAYOUT */
  .main {
    display: grid;
    grid-template-columns: 1fr 300px;
    gap: 0;
    height: calc(100vh - 120px);
  }

  /* CANVAS AREA */
  .canvas-area {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #020407;
    border-right: 1px solid var(--border);
    overflow: hidden;
  }

  .canvas-area video,
  .canvas-area canvas {
    max-width: 100%;
    max-height: 100%;
    display: block;
  }

  #displayCanvas {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    max-width: 100%; max-height: 100%;
  }

  #videoEl { opacity: 0; position: absolute; pointer-events: none; }

  .canvas-label {
    position: absolute;
    top: 12px; left: 12px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 3px;
    color: var(--dim);
    text-transform: uppercase;
    background: rgba(8,12,16,0.8);
    padding: 4px 8px;
    border: 1px solid var(--border);
  }

  /* SIDE PANEL */
  .side {
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    background: var(--panel);
  }

  .section {
    border-bottom: 1px solid var(--border);
    padding: 16px;
  }

  .section-title {
    font-size: 0.6rem;
    letter-spacing: 3px;
    color: var(--dim);
    text-transform: uppercase;
    font-family: 'Share Tech Mono', monospace;
    margin-bottom: 12px;
  }

  /* STATUS ROW */
  .status-grid {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .status-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 0.75rem;
    letter-spacing: 1px;
  }

  .status-row .key {
    color: var(--dim);
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.65rem;
  }

  .badge {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.65rem;
    padding: 2px 7px;
    border-radius: 2px;
    letter-spacing: 1px;
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--border);
    color: var(--dim);
  }

  .badge.ok { background: rgba(0,232,135,0.1); border-color: var(--green); color: var(--green); }
  .badge.err { background: rgba(255,34,51,0.1); border-color: var(--red); color: var(--red); }
  .badge.warn { background: rgba(255,170,0,0.1); border-color: #ffaa00; color: #ffaa00; }
  .badge.info { background: rgba(0,119,255,0.1); border-color: var(--blue); color: var(--blue); }

  /* NETWORK */
  .ip-display {
    font-family: 'Share Tech Mono', monospace;
    font-size: 1rem;
    color: var(--blue);
    letter-spacing: 2px;
    margin-bottom: 4px;
  }

  /* CONTROLS */
  .interval-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
  }

  .interval-row label {
    font-size: 0.65rem;
    letter-spacing: 2px;
    color: var(--dim);
    font-family: 'Share Tech Mono', monospace;
    white-space: nowrap;
  }

  input[type=range] {
    flex: 1;
    -webkit-appearance: none;
    height: 2px;
    background: var(--border);
    outline: none;
  }

  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: var(--red);
    cursor: pointer;
    box-shadow: 0 0 6px var(--red);
  }

  .interval-val {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.75rem;
    color: var(--red);
    min-width: 36px;
    text-align: right;
  }

  /* BUTTONS */
  .btn-row {
    display: flex;
    gap: 8px;
    margin-top: 8px;
  }

  button {
    font-family: 'Rajdhani', sans-serif;
    font-weight: 700;
    font-size: 0.75rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    border: 1px solid;
    cursor: pointer;
    padding: 9px 14px;
    transition: all 0.15s;
    border-radius: 1px;
    flex: 1;
  }

  .btn-run {
    background: rgba(255,34,51,0.08);
    border-color: var(--red);
    color: var(--red);
  }
  .btn-run:hover { background: rgba(255,34,51,0.2); box-shadow: 0 0 12px rgba(255,34,51,0.3); }
  .btn-run.running {
    background: rgba(255,34,51,0.15);
    box-shadow: 0 0 14px rgba(255,34,51,0.4);
    animation: pulse-btn 2s infinite;
  }

  @keyframes pulse-btn {
    0%,100% { box-shadow: 0 0 10px rgba(255,34,51,0.3); }
    50% { box-shadow: 0 0 22px rgba(255,34,51,0.6); }
  }

  .btn-stop {
    background: rgba(100,100,120,0.08);
    border-color: var(--dim);
    color: var(--dim);
    flex: 0 0 auto;
    padding: 9px 10px;
  }
  .btn-stop:hover { border-color: var(--text); color: var(--text); }

  .btn-once {
    background: rgba(0,119,255,0.08);
    border-color: var(--blue);
    color: var(--blue);
  }
  .btn-once:hover { background: rgba(0,119,255,0.18); }

  /* LOG */
  .log-area {
    flex: 1;
    overflow-y: auto;
    padding: 0;
  }

  .log-entry {
    padding: 6px 16px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.6rem;
    letter-spacing: 1px;
    border-bottom: 1px solid rgba(26,37,53,0.5);
    display: flex;
    gap: 8px;
    align-items: flex-start;
    line-height: 1.5;
  }

  .log-entry .ts { color: var(--dim); flex-shrink: 0; }
  .log-entry .msg { color: var(--text); word-break: break-all; }
  .log-entry.error .msg { color: var(--red); }
  .log-entry.success .msg { color: var(--green); }
  .log-entry.info .msg { color: var(--blue); }
  .log-entry.warn .msg { color: #ffaa00; }

  /* PROGRESS */
  .progress-bar {
    height: 2px;
    background: var(--border);
    position: relative;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--red), #ff7700);
    width: 0%;
    transition: width 0.3s linear;
    box-shadow: 0 0 8px var(--red);
  }

  .next-in {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.6rem;
    color: var(--dim);
    text-align: right;
    padding: 3px 16px 0;
    letter-spacing: 1px;
    height: 18px;
  }

  /* STEP INDICATOR */
  .step-indicator {
    position: absolute;
    bottom: 12px; right: 12px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 2px;
    color: var(--dim);
    background: rgba(8,12,16,0.85);
    padding: 5px 10px;
    border: 1px solid var(--border);
  }

  .step-indicator span { color: var(--red); }

  /* CHART BAR */
  .mini-chart {
    display: flex;
    align-items: flex-end;
    gap: 2px;
    height: 40px;
    margin-top: 8px;
  }

  .chart-bar {
    flex: 1;
    background: rgba(255,34,51,0.3);
    border-top: 1px solid rgba(255,34,51,0.7);
    transition: height 0.4s ease;
    min-height: 1px;
  }

  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
</style>
</head>
<body>

<header>
  <div class="dot" id="statusDot"></div>
  <h1>RGB&nbsp;Analyzer</h1>
  <div style="flex:1"></div>
  <div id="headerIp" style="font-family:'Share Tech Mono',monospace;font-size:0.7rem;color:var(--dim);letter-spacing:2px;">---</div>
</header>

<!-- METRICS -->
<div class="metrics">
  <div class="metric ref-m">
    <label>REF (red·on)</label>
    <div class="value" id="mRef">—</div>
    <div class="unit">AVG RED · TOP 75%</div>
  </div>
  <div class="metric val-m">
    <label>VAL (blue·on)</label>
    <div class="value" id="mVal">—</div>
    <div class="unit">AVG RED · TOP 75%</div>
  </div>
  <div class="metric ratio-m">
    <label>VAL / REF</label>
    <div class="value" id="mRatio">—</div>
    <div class="unit">RATIO</div>
  </div>
</div>

<!-- MAIN -->
<div class="main">

  <!-- CANVAS -->
  <div class="canvas-area">
    <video id="videoEl" autoplay playsinline muted></video>
    <canvas id="displayCanvas"></canvas>
    <div class="canvas-label" id="canvasLabel">IDLE</div>
    <div class="step-indicator">STEP <span id="stepNum">—</span></div>
  </div>

  <!-- SIDE PANEL -->
  <div class="side">

    <!-- NETWORK -->
    <div class="section">
      <div class="section-title">Sieć</div>
      <div class="ip-display" id="ipDisplay">wykrywanie…</div>
      <div class="status-grid">
        <div class="status-row">
          <span class="key">CAMERA</span>
          <span class="badge" id="camBadge">—</span>
        </div>
        <div class="status-row">
          <span class="key">TARGET HOST</span>
          <span class="badge info" id="targetBadge">—</span>
        </div>
      </div>
    </div>

    <!-- INTERVAL CONTROL -->
    <div class="section">
      <div class="section-title">Powtarzanie</div>
      <div class="interval-row">
        <label>OKRES</label>
        <input type="range" id="intervalSlider" min="1" max="60" value="5">
        <div class="interval-val"><span id="intervalVal">5</span> min</div>
      </div>

      <div class="btn-row">
        <button class="btn-run" id="btnRun" onclick="toggleRun()">▶ START</button>
        <button class="btn-stop" id="btnStop" onclick="stopLoop()" title="Stop">■</button>
      </div>
      <div class="btn-row">
        <button class="btn-once" onclick="runOnce()">POJEDYNCZY CYKL</button>
      </div>
    </div>

    <!-- PROGRESS -->
    <div class="section" id="progressSection" style="padding-bottom:8px;">
      <div class="section-title">Następny cykl</div>
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      <div class="next-in" id="nextIn"></div>
    </div>

    <!-- HISTORY CHART -->
    <div class="section">
      <div class="section-title">Historia Ratio</div>
      <div class="mini-chart" id="miniChart"></div>
    </div>

    <!-- LOG -->
    <div class="section" style="padding-bottom:0;border-bottom:none;">
      <div class="section-title">Log</div>
    </div>
    <div class="log-area" id="logArea"></div>

  </div>
</div>

<canvas id="hiddenCanvas" style="display:none"></canvas>

<script>
// ─── STATE ───────────────────────────────────────────────
let localIp = null;
let targetIp = null;
let stream = null;
let isRunning = false;
let loopTimer = null;
let countdownTimer = null;
let nextRunAt = null;
let ratioHistory = [];
let currentStep = 0;

const videoEl = document.getElementById('videoEl');
const hiddenCanvas = document.getElementById('hiddenCanvas');
const displayCanvas = document.getElementById('displayCanvas');
const hctx = hiddenCanvas.getContext('2d');
const dctx = displayCanvas.getContext('2d');

// ─── LOG ─────────────────────────────────────────────────
function log(msg, type='') {
  const area = document.getElementById('logArea');
  const ts = new Date().toTimeString().slice(0,8);
  const div = document.createElement('div');
  div.className = 'log-entry ' + type;
  div.innerHTML = `<span class="ts">${ts}</span><span class="msg">${msg}</span>`;
  area.prepend(div);
  if (area.children.length > 200) area.lastChild.remove();
}

function setStep(n, label) {
  currentStep = n;
  document.getElementById('stepNum').textContent = n;
  document.getElementById('canvasLabel').textContent = label;
}

// ─── NETWORK ─────────────────────────────────────────────
async function detectNetwork() {
  try {
    const pc = new RTCPeerConnection({iceServers:[]});
    pc.createDataChannel('');
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    await new Promise(r => {
      pc.onicecandidate = e => { if(e.candidate) r(); };
      setTimeout(r, 2000);
    });
    const sdp = pc.localDescription.sdp;
    const match = sdp.match(/candidate:[^\r\n]*/g);
    let bestIp = null;
    if (match) {
      for (const c of match) {
        const m = c.match(/(\d+\.\d+\.\d+\.\d+)/);
        if (m && !m[1].startsWith('127.')) { bestIp = m[1]; break; }
      }
    }
    pc.close();
    if (bestIp) {
      localIp = bestIp;
      const parts = bestIp.split('.');
      parts[3] = '140';
      targetIp = parts.join('.');
      document.getElementById('ipDisplay').textContent = bestIp;
      document.getElementById('headerIp').textContent = targetIp;
      document.getElementById('targetBadge').textContent = targetIp;
      document.getElementById('targetBadge').className = 'badge info';
      log(`Sieć lokalna: ${bestIp}`, 'info');
      log(`Target: ${targetIp}`, 'success');
    } else throw new Error('Nie znaleziono IP');
  } catch(e) {
    localIp = 'unknown';
    targetIp = '192.168.1.140';
    document.getElementById('ipDisplay').textContent = 'Niedostępne – używam .140';
    document.getElementById('targetBadge').textContent = targetIp;
    document.getElementById('headerIp').textContent = targetIp;
    log('Nie można wykryć IP, domyślnie: ' + targetIp, 'warn');
  }
}

// ─── CAMERA ──────────────────────────────────────────────
async function initCamera() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
    videoEl.srcObject = stream;
    await new Promise(r => videoEl.onloadedmetadata = r);
    await videoEl.play();
    hiddenCanvas.width = videoEl.videoWidth;
    hiddenCanvas.height = videoEl.videoHeight;
    displayCanvas.width = videoEl.videoWidth;
    displayCanvas.height = videoEl.videoHeight;
    document.getElementById('camBadge').textContent = `${videoEl.videoWidth}×${videoEl.videoHeight}`;
    document.getElementById('camBadge').className = 'badge ok';
    document.getElementById('statusDot').className = 'dot active';
    log(`Kamera: ${videoEl.videoWidth}×${videoEl.videoHeight}`, 'success');
  } catch(e) {
    document.getElementById('camBadge').textContent = 'BŁĄD';
    document.getElementById('camBadge').className = 'badge err';
    log('Kamera: ' + e.message, 'error');
  }
}

// ─── CAPTURE ─────────────────────────────────────────────
function captureFrame() {
  hctx.drawImage(videoEl, 0, 0);
  return hctx.getImageData(0, 0, hiddenCanvas.width, hiddenCanvas.height);
}

// ─── HTTP ─────────────────────────────────────────────────
async function httpGet(endpoint) {
  const url = `http://${targetIp}${endpoint}`;
  try {
    await fetch(url, { method: 'GET', mode: 'no-cors', signal: AbortSignal.timeout(3000) });
    log(`HTTP GET ${endpoint} → OK`, 'success');
  } catch(e) {
    log(`HTTP GET ${endpoint} → ${e.message}`, 'warn');
  }
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

// ─── IMAGE PROCESSING ────────────────────────────────────
function subtractFrames(imgA, imgB) {
  // B - A without abs (can be negative, clamp to 0)
  const w = imgA.width, h = imgA.height;
  const out = new ImageData(w, h);
  for (let i = 0; i < imgA.data.length; i += 4) {
    out.data[i]   = Math.max(0, imgB.data[i]   - imgA.data[i]);   // R
    out.data[i+1] = Math.max(0, imgB.data[i+1] - imgA.data[i+1]); // G (not used)
    out.data[i+2] = Math.max(0, imgB.data[i+2] - imgA.data[i+2]); // B (not used)
    out.data[i+3] = 255;
  }
  return out;
}

function maskLowRed(img, threshold=10) {
  // pixels with red < threshold → black
  const out = new ImageData(new Uint8ClampedArray(img.data), img.width, img.height);
  for (let i = 0; i < out.data.length; i += 4) {
    if (out.data[i] < threshold) {
      out.data[i] = out.data[i+1] = out.data[i+2] = 0;
    }
  }
  return out;
}

function top75AvgRed(img) {
  // collect non-black red values, sort desc, take top 75%, compute mean
  const reds = [];
  for (let i = 0; i < img.data.length; i += 4) {
    const r = img.data[i];
    if (r > 0) reds.push(r);
  }
  if (reds.length === 0) return 0;
  reds.sort((a, b) => b - a); // descending
  const count = Math.ceil(reds.length * 0.75);
  const top = reds.slice(0, count);
  return top.reduce((s, v) => s + v, 0) / top.length;
}

function showFrame(img, label) {
  dctx.putImageData(img, 0, 0);
  document.getElementById('canvasLabel').textContent = label;
}

// ─── RATIO HISTORY ───────────────────────────────────────
function updateChart(ratio) {
  ratioHistory.push(ratio);
  if (ratioHistory.length > 20) ratioHistory.shift();
  const chart = document.getElementById('miniChart');
  chart.innerHTML = '';
  const max = Math.max(...ratioHistory, 1);
  for (const v of ratioHistory) {
    const bar = document.createElement('div');
    bar.className = 'chart-bar';
    bar.style.height = Math.max(2, (v / max) * 38) + 'px';
    bar.title = v.toFixed(3);
    chart.appendChild(bar);
  }
}

// ─── MAIN SEQUENCE ───────────────────────────────────────
async function runSequence() {
  if (!stream) { log('Kamera niedostępna!', 'error'); return; }

  log('═══ START SEKWENCJI ═══', 'info');

  // STEP 1 – frame 1 (baseline)
  setStep(1, 'KROK 1 – Zdjęcie bazowe (n1)');
  const frame1 = captureFrame();
  showFrame(frame1, 'ZDJĘCIE N1 (bazowe)');
  log('Zdjęcie n1 wykonane');

  // STEP 2 – /redon
  setStep(2, 'KROK 2 – /redon');
  await httpGet('/redon');

  // STEP 3 – wait 100ms
  setStep(3, 'KROK 3 – Oczekiwanie 100ms');
  log('Oczekiwanie 100ms…');
  await sleep(100);

  // STEP 4 – frame 2
  setStep(4, 'KROK 4 – Zdjęcie n2');
  const frame2 = captureFrame();
  showFrame(frame2, 'ZDJĘCIE N2 (red on)');
  log('Zdjęcie n2 wykonane');

  // STEP 5 – /redoff
  setStep(5, 'KROK 5 – /redoff');
  await httpGet('/redoff');

  // STEP 6 – diff n2-n1, mask
  setStep(6, 'KROK 6 – Oblicz diff RED n2–n1');
  const diffRed = subtractFrames(frame1, frame2);
  const maskedRed = maskLowRed(diffRed, 10);
  showFrame(maskedRed, 'DIFF N2–N1 (maskowany, czerwony)');
  log('Diff czerwony obliczony, piksele <10 → czarne');

  // STEP 7 – Ref
  setStep(7, 'KROK 7 – Oblicz Ref (top 75% avg red)');
  const Ref = top75AvgRed(maskedRed);
  log(`Ref = ${Ref.toFixed(2)}`, 'success');
  document.getElementById('mRef').textContent = Ref.toFixed(1);

  // STEP 8 – /blueon
  setStep(8, 'KROK 8 – /blueon');
  await httpGet('/blueon');

  // STEP 9 – wait 300ms
  setStep(9, 'KROK 9 – Oczekiwanie 300ms');
  log('Oczekiwanie 300ms…');
  await sleep(300);

  // STEP 10 – frame 3
  setStep(10, 'KROK 10 – Zdjęcie n3');
  const frame3 = captureFrame();
  showFrame(frame3, 'ZDJĘCIE N3 (blue on)');
  log('Zdjęcie n3 wykonane');

  // STEP 11 – /blueoff
  setStep(11, 'KROK 11 – /blueoff');
  await httpGet('/blueoff');

  // STEP 12 – diff n3-n1, mask
  setStep(12, 'KROK 12 – Oblicz diff RED n3–n1');
  const diffBlue = subtractFrames(frame1, frame3);
  const maskedBlue = maskLowRed(diffBlue, 10);
  showFrame(maskedBlue, 'DIFF N3–N1 (maskowany)');
  log('Diff niebieski obliczony, piksele <10 → czarne');

  // STEP 13 – Val
  setStep(13, 'KROK 13 – Oblicz Val (top 75% avg red)');
  const Val = top75AvgRed(maskedBlue);
  log(`Val = ${Val.toFixed(2)}`, 'success');
  document.getElementById('mVal').textContent = Val.toFixed(1);

  // STEP 14 – ratio
  setStep(14, 'KROK 14 – Oblicz Val/Ref');
  const ratio = Ref > 0 ? Val / Ref : 0;
  document.getElementById('mRatio').textContent = ratio.toFixed(4);
  log(`Ratio = Val/Ref = ${ratio.toFixed(4)}`, 'success');
  updateChart(ratio);

  setStep('OK', 'GOTOWE');
  log('═══ KONIEC SEKWENCJI ═══', 'info');
}

// ─── LOOP CONTROL ─────────────────────────────────────────
async function toggleRun() {
  if (isRunning) {
    stopLoop();
  } else {
    await startLoop();
  }
}

async function startLoop() {
  if (isRunning) return;
  isRunning = true;
  document.getElementById('btnRun').textContent = '⏹ STOP';
  document.getElementById('btnRun').classList.add('running');
  log('Pętla uruchomiona', 'success');
  await doLoop();
}

function stopLoop() {
  isRunning = false;
  clearTimeout(loopTimer);
  clearInterval(countdownTimer);
  document.getElementById('btnRun').textContent = '▶ START';
  document.getElementById('btnRun').classList.remove('running');
  document.getElementById('progressFill').style.width = '0%';
  document.getElementById('nextIn').textContent = '';
  log('Pętla zatrzymana', 'warn');
}

async function doLoop() {
  if (!isRunning) return;
  await runSequence();
  if (!isRunning) return;

  const minutes = parseInt(document.getElementById('intervalSlider').value);
  const ms = minutes * 60 * 1000;
  nextRunAt = Date.now() + ms;

  clearInterval(countdownTimer);
  countdownTimer = setInterval(() => {
    if (!isRunning) { clearInterval(countdownTimer); return; }
    const remaining = nextRunAt - Date.now();
    if (remaining <= 0) { clearInterval(countdownTimer); return; }
    const pct = ((ms - remaining) / ms) * 100;
    document.getElementById('progressFill').style.width = pct + '%';
    const mins = Math.floor(remaining / 60000);
    const secs = Math.floor((remaining % 60000) / 1000);
    document.getElementById('nextIn').textContent =
      `następny cykl za ${mins}:${String(secs).padStart(2,'0')}`;
  }, 500);

  loopTimer = setTimeout(async () => {
    clearInterval(countdownTimer);
    document.getElementById('progressFill').style.width = '0%';
    await doLoop();
  }, ms);
}

async function runOnce() {
  if (isRunning) { log('Pętla aktywna – zatrzymaj przed pojedynczym cyklem', 'warn'); return; }
  await runSequence();
}

// ─── INTERVAL SLIDER ──────────────────────────────────────
document.getElementById('intervalSlider').addEventListener('input', function() {
  document.getElementById('intervalVal').textContent = this.value;
});

// ─── INIT ─────────────────────────────────────────────────
(async () => {
  log('Inicjalizacja…', 'info');
  await detectNetwork();
  await initCamera();
  log('Gotowy. Naciśnij START lub POJEDYNCZY CYKL.', 'success');
})();
