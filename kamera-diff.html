<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>CameraDiff</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #111; color: #eee; font-family: monospace; font-size: 16px; padding: 12px; }
  h1 { font-size: 20px; margin-bottom: 10px; color: #0f0; }
  button#startBtn {
    display: block; width: 100%; padding: 18px;
    font-size: 22px; font-family: monospace;
    background: #0a0; color: #fff; border: none;
    cursor: pointer; margin-bottom: 12px;
  }
  button#startBtn:disabled { background: #444; color: #888; }
  #log { background: #000; border: 1px solid #333; padding: 8px; min-height: 80px; font-size: 13px; color: #0f0; white-space: pre-wrap; margin-bottom: 10px; }
  #results { background: #000; border: 1px solid #333; padding: 10px; margin-bottom: 10px; font-size: 15px; display: none; }
  #results .val { color: #ff0; font-size: 20px; font-weight: bold; }
  .canvases { display: flex; flex-wrap: wrap; gap: 8px; }
  canvas { border: 1px solid #333; max-width: 100%; }
  label { display: block; font-size: 12px; color: #888; margin-bottom: 2px; }
  video { display: none; }
  #ipRow { margin-bottom: 10px; }
  #ipRow input { background: #222; color: #eee; border: 1px solid #444; padding: 6px; font-size: 15px; font-family: monospace; width: 180px; }
  #ipRow span { color: #888; font-size: 13px; }
</style>
</head>
<body>
<h1>&#9675; CameraDiff</h1>

<div id="ipRow">
  <span>Serwer IP (ostatni oktet = 140):</span><br>
  <input id="serverIP" type="text" value="192.168.1.140" placeholder="np. 192.168.1.140">
</div>

<button id="startBtn">&#9654; START </button>

<div id="log">Gotowy. Naciśnij START.</div>

<div id="results">
  <div>Avg RED (top 25%): <span class="val" id="resR">-</span></div>
  <div>Avg BLUE (top 25%): <span class="val" id="resB">-</span></div>
  <div>RED/BLUE ratio: <span class="val" id="resRatio">-</span></div>
</div>

<div class="canvases">
  <div><label>Zdjęcie 1</label><canvas id="c1" width="320" height="240"></canvas></div>
  <div><label>Zdjęcie 2</label><canvas id="c2" width="320" height="240"></canvas></div>
  <div><label>Różnica (przetworzona)</label><canvas id="cdiff" width="320" height="240"></canvas></div>
</div>

<video id="video" autoplay playsinline></video>

<script>
const btn = document.getElementById('startBtn');
const logEl = document.getElementById('log');
const resultsEl = document.getElementById('results');
const resR = document.getElementById('resR');
const resB = document.getElementById('resB');
const resRatio = document.getElementById('resRatio');
const c1 = document.getElementById('c1');
const c2 = document.getElementById('c2');
const cdiff = document.getElementById('cdiff');
const video = document.getElementById('video');

function log(msg) {
  logEl.textContent += '\n' + msg;
  logEl.scrollTop = logEl.scrollHeight;
}

function sleep(ms) {
  return new Promise(r => setTimeout(r, ms));
}

async function httpGet(url) {
  try {
    const res = await fetch('http://' + url, { mode: 'no-cors', signal: AbortSignal.timeout(3000) });
    return true;
  } catch(e) {
    return false;
  }
}

async function getLocalIP() {
  return new Promise(resolve => {
    const pc = new RTCPeerConnection({ iceServers: [] });
    pc.createDataChannel('');
    pc.createOffer().then(o => pc.setLocalDescription(o));
    const found = [];
    const timer = setTimeout(() => {
      pc.close();
      resolve(found);
    }, 2000);
    pc.onicecandidate = e => {
      if (!e.candidate) return;
      const m = e.candidate.candidate.match(/(\d+\.\d+\.\d+\.\d+)/);
      if (m && !m[1].startsWith('127.')) {
        found.push(m[1]);
      }
    };
  });
}

function captureFrame(canvas) {
  const ctx = canvas.getContext('2d');
  canvas.width = video.videoWidth || 320;
  canvas.height = video.videoHeight || 240;
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
  return ctx.getImageData(0, 0, canvas.width, canvas.height);
}

function kernel9x9avg(data, width, height) {
  const out = new Uint8ClampedArray(data.length);
  const r = 4; // radius = 4, kernel 9x9
  for (let y = 0; y < height; y++) {
    for (let x = 0; x < width; x++) {
      let sr = 0, sg = 0, sb = 0, count = 0;
      for (let dy = -r; dy <= r; dy++) {
        for (let dx = -r; dx <= r; dx++) {
          const nx = x + dx, ny = y + dy;
          if (nx >= 0 && nx < width && ny >= 0 && ny < height) {
            const i = (ny * width + nx) * 4;
            sr += data[i]; sg += data[i+1]; sb += data[i+2];
            count++;
          }
        }
      }
      const i = (y * width + x) * 4;
      out[i]   = sr / count;
      out[i+1] = sg / count;
      out[i+2] = sb / count;
      out[i+3] = 255;
    }
  }
  return out;
}

async function initCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }
    });
    video.srcObject = stream;
    await new Promise(r => { video.onloadedmetadata = r; });
    await video.play();
    log('Kamera: OK (' + video.videoWidth + 'x' + video.videoHeight + ')');
    return true;
  } catch(e) {
    log('Błąd kamery: ' + e.message);
    return false;
  }
}

async function runSequence() {
  btn.disabled = true;
  logEl.textContent = '';
  resultsEl.style.display = 'none';

  // Krok 1: Określenie przestrzeni adresowej sieci WiFi
  log('[1] Wykrywanie adresu sieci lokalnej...');
  const ips = await getLocalIP();
  let localIP = '';
  if (ips.length > 0) {
    localIP = ips[0];
    log('    Znaleziono IP: ' + ips.join(', '));
  } else {
    log('    Brak wykrytego IP (WebRTC niedostępne)');
  }

  // Odczytaj IP serwera z pola
  const serverIP = document.getElementById('serverIP').value.trim();
  log('    Serwer docelowy: ' + serverIP);

  // Krok 2: Wysłanie HTTP do *.*.*.140/on
  log('[2] HTTP GET -> http://' + serverIP + '/on');
  const onOk = await httpGet(serverIP + '/on');
  log('    Status: ' + (onOk ? 'OK' : 'brak odpowiedzi (no-cors)'));

  // Krok 3: Oczekiwanie 100ms
  log('[3] Oczekiwanie 100ms...');
  await sleep(100);

  // Krok 4: Zdjęcie pierwsze
  log('[4] Zdjęcie 1...');
  const img1 = captureFrame(c1);
  log('    Rozmiar: ' + c1.width + 'x' + c1.height);

  // Krok 5: Oczekiwanie 300ms
  log('[5] Oczekiwanie 300ms...');
  await sleep(300);

  // Krok 6: Zdjęcie drugie
  log('[6] Zdjęcie 2...');
  const img2 = captureFrame(c2);

  // Krok 7: HTTP *.*.*.140/off
  log('[7] HTTP GET -> http://' + serverIP + '/off');
  const offOk = await httpGet(serverIP + '/off');
  log('    Status: ' + (offOk ? 'OK' : 'brak odpowiedzi (no-cors)'));

  const W = c1.width, H = c1.height;

  // Krok 8: Odejmij img1 od img2 BEZ wartości bezwzględnych
  log('[8] Obliczanie różnicy img2 - img1...');
  const diffRaw = new Float32Array(W * H * 4);
  for (let i = 0; i < W * H * 4; i++) {
    diffRaw[i] = img2.data[i] - img1.data[i];
  }

  // Krok 9: Wartości ujemne -> 0
  log('[9] Przycinanie wartości ujemnych do 0...');
  const diffClamped = new Uint8ClampedArray(W * H * 4);
  for (let i = 0; i < W * H * 4; i += 4) {
    diffClamped[i]   = diffRaw[i]   < 0 ? 0 : diffRaw[i];
    diffClamped[i+1] = diffRaw[i+1] < 0 ? 0 : diffRaw[i+1];
    diffClamped[i+2] = diffRaw[i+2] < 0 ? 0 : diffRaw[i+2];
    diffClamped[i+3] = 255;
  }

  // Krok 10: Uśrednianie kernelem 9x9
  log('[10] Filtr uśredniający 9x9...');
  const diffBlurred = kernel9x9avg(diffClamped, W, H);

  // Krok 11: Piksele gdzie czerwony < 10 -> czarny
  log('[11] Maskowanie: czerwony < 10 -> czarny...');
  for (let i = 0; i < W * H * 4; i += 4) {
    if (diffBlurred[i] < 10) {
      diffBlurred[i] = 0;
      diffBlurred[i+1] = 0;
      diffBlurred[i+2] = 0;
    }
  }

  // Krok 12: Sortowanie pikseli malejąco wg czerwonego
  log('[12] Sortowanie pikseli malejąco (po R)...');
  const pixels = [];
  for (let i = 0; i < W * H * 4; i += 4) {
    if (diffBlurred[i] > 0 || diffBlurred[i+1] > 0 || diffBlurred[i+2] > 0) {
      pixels.push([diffBlurred[i], diffBlurred[i+1], diffBlurred[i+2]]);
    }
  }
  pixels.sort((a, b) => b[0] - a[0]);
  log('    Aktywnych pikseli: ' + pixels.length);

  // Krok 13: 25% maksymalnych -> avg R i B
  log('[13] Obliczanie średniej R i B dla top 25%...');
  const top25count = Math.max(1, Math.floor(pixels.length * 0.25));
  let sumR = 0, sumB = 0;
  for (let i = 0; i < top25count; i++) {
    sumR += pixels[i][0];
    sumB += pixels[i][2];
  }
  const avgR = sumR / top25count;
  const avgB = sumB / top25count;
  const ratio = avgB > 0 ? (avgR / avgB) : Infinity;

  // Krok 14: Wyświetlenie wyników
  log('[14] Wyniki:');
  log('    avg RED  = ' + avgR.toFixed(2));
  log('    avg BLUE = ' + avgB.toFixed(2));
  log('    R/B ratio = ' + (isFinite(ratio) ? ratio.toFixed(4) : '∞'));

  resR.textContent = avgR.toFixed(2);
  resB.textContent = avgB.toFixed(2);
  resRatio.textContent = isFinite(ratio) ? ratio.toFixed(4) : '∞';
  resultsEl.style.display = 'block';

  // Rysuj różnicę na canvas
  const diffCtx = cdiff.getContext('2d');
  cdiff.width = W; cdiff.height = H;
  const diffImgData = new ImageData(diffBlurred, W, H);
  diffCtx.putImageData(diffImgData, 0, 0);

  log('\n[OK] Sekwencja zakończona.');
  btn.disabled = false;
}

// Init
(async () => {
  const ok = await initCamera();
  if (!ok) {
    btn.disabled = false;
  }
  btn.addEventListener('click', runSequence);
})();
</script>
</body>
</html>
